<!doctype html>
<html lang="es-CL">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Autodiagnóstico de convivencia educativa · Eventuras</title>
<meta name="description" content="Dieciséis preguntas sobre las prácticas instaladas en tu colegio. Recibes un informe con tres acciones concretas para el año escolar.">
<meta name="robots" content="index, follow">
<meta property="og:title" content="Autodiagnóstico de convivencia educativa · Eventuras">
<meta property="og:description" content="Dieciséis preguntas, seis minutos, y un informe con tres acciones concretas para el año escolar.">
<meta property="og:type" content="website">
<link rel="icon" href="logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:ital,wght@0,400;0,600;0,700;0,800;1,400&display=swap">
<style>
:root{
  --verde:#93C11F; --verde-hondo:#6E9112; --verde-tenue:#F3F9E4;
  --coral:#E25D5D; --coral-tenue:#FDEEEE;
  --tinta:#383838; --tinta-media:#6E6E6E; --tinta-tenue:#9B9B9B;
  --papel:#FFFFFF; --fondo:#F7F7F4; --linea:#E4E4DE;
  --sombra:0 1px 2px rgba(56,56,56,.06), 0 8px 24px rgba(56,56,56,.07);
  --display:'Nunito', ui-rounded, 'Segoe UI', system-ui, -apple-system, sans-serif;
  --radio:14px;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --verde:#A7D634; --verde-hondo:#C2E55F; --verde-tenue:#22301A;
    --coral:#F08A8A; --coral-tenue:#36201F;
    --tinta:#ECECE7; --tinta-media:#B0B0A8; --tinta-tenue:#85857D;
    --papel:#23241F; --fondo:#1A1B17; --linea:#36372F;
    --sombra:0 1px 2px rgba(0,0,0,.4), 0 8px 24px rgba(0,0,0,.35);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --verde:#A7D634; --verde-hondo:#C2E55F; --verde-tenue:#22301A;
  --coral:#F08A8A; --coral-tenue:#36201F;
  --tinta:#ECECE7; --tinta-media:#B0B0A8; --tinta-tenue:#85857D;
  --papel:#23241F; --fondo:#1A1B17; --linea:#36372F;
  --sombra:0 1px 2px rgba(0,0,0,.4), 0 8px 24px rgba(0,0,0,.35);
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--fondo);color:var(--tinta);font-family:var(--display);font-size:16px;line-height:1.55;-webkit-font-smoothing:antialiased;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
img{max-width:100%}
[hidden]{display:none!important}
.wrap{max-width:720px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 64px}
h1,h2,h3{margin:0;text-wrap:balance;font-weight:800;letter-spacing:-.015em}
p{margin:0}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
input,select,textarea{font:inherit;color:inherit}
a{color:var(--verde-hondo)}
:focus-visible{outline:3px solid var(--verde);outline-offset:2px}

header.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:18px 8px}
header.top img{height:40px;width:auto}
header.top .cuenta{font-size:.78rem;color:var(--tinta-tenue);font-variant-numeric:tabular-nums}
.pasos{display:flex;gap:3px;padding-block:6px 20px}
.paso{flex:1;height:4px;border-radius:99px;background:var(--linea);transition:background .25s}
.paso.on{background:var(--verde)}

.intro .ojo{font-size:.76rem;font-weight:800;letter-spacing:.09em;text-transform:uppercase;color:var(--verde-hondo);margin-bottom:8px}
.intro h1{font-size:clamp(1.5rem,5.2vw,2.05rem);line-height:1.15}
.intro p.sub{color:var(--tinta-media);margin-top:10px;max-width:54ch}

.card{background:var(--papel);border:1px solid var(--linea);border-radius:var(--radio);box-shadow:var(--sombra)}
section.step{margin-top:22px}
.q{font-size:1.14rem;font-weight:800;margin-bottom:4px;line-height:1.3}
.hint{font-size:.87rem;color:var(--tinta-media);margin-bottom:14px}
.dimtag{font-size:.72rem;font-weight:800;letter-spacing:.09em;text-transform:uppercase;color:var(--verde-hondo);margin-bottom:6px}
.alcance{font-size:.84rem;color:var(--tinta-media);font-style:italic;margin-bottom:12px}

.search{position:relative}
.search input{width:100%;padding:15px 16px;border:1.5px solid var(--linea);border-radius:var(--radio);background:var(--papel);outline:none}
.search input:focus{border-color:var(--verde);box-shadow:0 0 0 3px var(--verde-tenue)}
.res{margin-top:8px;max-height:310px;overflow-y:auto;border-radius:var(--radio);border:1px solid var(--linea);background:var(--papel);box-shadow:var(--sombra)}
.res button{display:block;width:100%;text-align:left;padding:11px 14px;border-bottom:1px solid var(--linea)}
.res button:last-child{border-bottom:0}
.res button:hover,.res button:focus-visible{background:var(--verde-tenue)}
.res .nm{font-weight:700;font-size:.93rem;line-height:1.3;display:block}
.res .mt{font-size:.78rem;color:var(--tinta-media);margin-top:1px;display:block}
.vacio{padding:14px;font-size:.86rem;color:var(--tinta-media)}
.elegido{display:flex;gap:12px;align-items:flex-start;padding:14px 15px;border-radius:var(--radio);background:var(--verde-tenue);border:1px solid var(--verde)}
.elegido .nm{font-weight:800;line-height:1.25}
.elegido .mt{font-size:.82rem;color:var(--tinta-media);margin-top:2px}

.opts{display:grid;gap:10px}
.opt{display:block;width:100%;text-align:left;padding:14px 15px;border:1.5px solid var(--linea);border-radius:var(--radio);background:var(--papel);transition:border-color .15s,background .15s}
.opt:hover{border-color:var(--verde)}
.opt.sel{border-color:var(--verde);background:var(--verde-tenue);border-width:2px}
.opt .t{font-weight:800;font-size:.95rem}
.opt.plano{padding:15px 16px}
.opt.plano .d{font-size:.93rem;color:var(--tinta);margin-top:0;line-height:1.5}
.opt.plano.sel .d{font-weight:700}
.marcaciclo{display:flex;gap:10px;align-items:flex-start;width:100%;text-align:left;padding:11px 13px;margin-bottom:14px;
  border:1.5px dashed var(--linea);border-radius:12px;font-size:.84rem;color:var(--tinta-media);line-height:1.45}
.marcaciclo:hover{border-color:var(--verde)}
.marcaciclo.sel{border-style:solid;border-color:var(--verde);background:var(--verde-tenue);color:var(--tinta)}
.marcaciclo .bx{flex:none;width:19px;height:19px;border-radius:5px;border:1.5px solid var(--linea);background:var(--papel);
  display:grid;place-items:center;font-size:.72rem;font-weight:800;color:var(--verde-hondo);margin-top:1px}
.marcaciclo.sel .bx{border-color:var(--verde)}
.opt .d{font-size:.87rem;color:var(--tinta-media);margin-top:3px;line-height:1.45;display:block}
.salidas{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.salida{font-size:.8rem;padding:8px 14px;border-radius:99px;border:1.5px solid var(--linea);color:var(--tinta-media);background:var(--papel)}
.salida:hover{border-color:var(--tinta-tenue);color:var(--tinta)}
.salida.sel{border-color:var(--verde);background:var(--verde-tenue);color:var(--verde-hondo);font-weight:800}

.acc{display:flex;gap:10px;margin-top:18px;flex-wrap:wrap;align-items:center}
.btn{padding:13px 22px;border-radius:99px;font-weight:800;font-size:.95rem;text-decoration:none;display:inline-block}
.btn.p{background:var(--verde);color:#1F2A08}
.btn.p:hover{background:var(--verde-hondo);color:#fff}
.btn.s{border:1.5px solid var(--linea);color:var(--tinta-media)}
.btn.s:hover{border-color:var(--tinta-tenue);color:var(--tinta)}
.btn[disabled]{opacity:.45;cursor:not-allowed}

.conf{display:flex;gap:11px;align-items:flex-start;padding:14px 15px;border-radius:var(--radio);background:var(--papel);border:1px solid var(--linea);font-size:.86rem;line-height:1.5;color:var(--tinta-media)}
.conf .ic{flex:none;width:26px;height:26px;border-radius:99px;background:var(--verde-tenue);border:1px solid var(--verde);display:grid;place-items:center;color:var(--verde-hondo);font-weight:800;font-size:.8rem}
.conf b{color:var(--tinta)}

.espejo{display:grid;gap:0}
.espejo .ln{display:grid;grid-template-columns:118px 1fr;gap:12px;padding-block:12px;border-top:1px solid var(--linea);align-items:start}
.espejo .ln:first-child{border-top:0}
.espejo .dd{font-size:.72rem;font-weight:800;letter-spacing:.07em;text-transform:uppercase;color:var(--verde-hondo);line-height:1.35}
.espejo .tx{font-size:.9rem;line-height:1.45}

/* ====== informe ====== */
.prop{overflow:hidden;margin-top:18px}
.prop .cab{background:var(--verde);color:#1F2A08;padding:20px 22px}
.prop .cab .k{font-size:.72rem;font-weight:800;letter-spacing:.1em;text-transform:uppercase;opacity:.75}
.prop .cab h2{font-size:1.4rem;margin-top:3px;line-height:1.2}
.prop .cab .para{font-size:.86rem;margin-top:6px;font-weight:700;opacity:.9}
.prop .cuerpo{padding:20px 22px}
.bloq{padding-block:18px;border-top:1px solid var(--linea)}
.bloq:first-child{border-top:0;padding-top:0}
.bloq h3{font-size:.74rem;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--verde-hondo);margin-bottom:12px}
.lista{display:grid;gap:9px}
.li{display:flex;gap:9px;font-size:.92rem;line-height:1.45}
.li .pt{flex:none;width:7px;height:7px;border-radius:99px;background:var(--verde);margin-top:8px}
.sp5{display:grid;gap:13px}
.sp5 .it{display:flex;gap:11px}
.sp5 .n{flex:none;width:25px;height:25px;border-radius:99px;background:var(--coral);color:#fff;font-size:.76rem;font-weight:800;display:grid;place-items:center;margin-top:1px}
.sp5 .tt{font-weight:800;font-size:.93rem;line-height:1.3}
.sp5 .dd{font-size:.86rem;color:var(--tinta-media);line-height:1.45;margin-top:2px}
.sp5 .mes{display:inline-block;margin-top:5px;font-size:.72rem;font-weight:800;color:var(--verde-hondo);background:var(--verde-tenue);border:1px solid var(--verde);padding:2px 9px;border-radius:99px}

.radarbox{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,276px);gap:16px;align-items:center;break-inside:avoid}
@media (max-width:620px){.radarbox{grid-template-columns:1fr}}
.leyenda{display:grid;gap:6px;min-width:0}
.leyenda .f{display:grid;gap:3px;font-size:.84rem;padding-bottom:6px;border-bottom:1px solid var(--linea);min-width:0}
.leyenda .f:last-child{border-bottom:0}
.leyenda .nm{font-weight:700;line-height:1.3;min-width:0;overflow-wrap:break-word}
.leyenda .bn{font-size:.7rem;font-weight:800;letter-spacing:.02em;padding:2px 9px;border-radius:99px;white-space:nowrap;border:1px solid;justify-self:start}
.b3{background:var(--verde-tenue);color:var(--verde-hondo);border-color:var(--verde)}
.b2{background:#FFF7E3;color:#8A6A12;border-color:#E8C76A}
.b1{background:var(--coral-tenue);color:var(--coral);border-color:var(--coral)}
.b0,.b-sin{background:var(--fondo);color:var(--tinta-tenue);border-color:var(--linea)}
.b-disp{background:var(--papel);color:var(--tinta-media);border-color:var(--tinta-tenue);border-style:dashed}
.leyenda .atras{display:flex;align-items:center;gap:6px;font-size:.73rem;line-height:1.25;color:var(--tinta-tenue);margin-top:1px}
.leyenda .atras .niv{flex:none}
.niv{display:inline-flex;gap:2.5px;align-items:center}
.niv i{display:block;width:11px;height:5px;border-radius:2px;background:var(--linea)}
.niv i.on{background:var(--verde-hondo)}
.niv.sr i{background:transparent;border:1px dashed var(--linea);height:3px}
.resumen{margin:0 0 2px;padding:14px 16px;border-radius:var(--radio);background:var(--verde-tenue);border:1px solid var(--verde)}
.resumen .rt{font-size:.72rem;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--verde-hondo)}
.resumen .rc{font-size:.93rem;line-height:1.45;margin-top:5px}
.resumen .rl{display:grid;gap:5px;margin-top:10px;padding-top:9px;border-top:1px solid var(--verde)}
.resumen .rl>div{font-size:.93rem;line-height:1.45}
.resumen .rl b{display:block;font-size:.72rem;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--verde-hondo);margin-bottom:1px}
.resumen .rv{display:inline-block;margin-top:6px;font-size:.72rem;font-weight:800;color:var(--verde-hondo);background:var(--papel);border:1px solid var(--verde);padding:2px 9px;border-radius:99px}
.criterio{padding:14px 16px;border-radius:var(--radio);background:var(--fondo);border:1px solid var(--linea);margin-bottom:15px}
.criterio .k{font-size:.72rem;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--tinta-tenue)}
.criterio .t{font-weight:800;font-size:.95rem;margin-top:3px;line-height:1.3}
.criterio .p{font-size:.85rem;color:var(--tinta-media);line-height:1.5;margin-top:7px}
.sp5 .sig{font-size:.84rem;line-height:1.45;margin-top:7px;padding:8px 11px;border-radius:10px;background:var(--verde-tenue);border:1px solid var(--verde)}
.sp5 .sig b{color:var(--verde-hondo)}
.sp5 .porqp{font-size:.83rem;line-height:1.45;margin-top:6px;color:var(--tinta-media)}
.sp5 .porqp b{color:var(--tinta)}
.segunda{display:grid;gap:11px;padding:16px 17px;border-radius:var(--radio);background:var(--fondo);border:1px solid var(--linea)}
.segunda>div{font-size:.89rem;line-height:1.5}
.segunda b{color:var(--tinta)}
.segunda .lin{padding-block:9px;border-block:1px solid var(--linea);color:var(--tinta-media);line-height:1.9}
.avisos{display:grid;gap:11px}
.avi{padding:13px 15px;border-radius:var(--radio);background:var(--fondo);border:1px solid var(--linea)}
.avi .at{font-weight:800;font-size:.9rem;line-height:1.3}
.avi .ar{display:flex;flex-wrap:wrap;gap:5px;margin-top:7px}
.avi .ar span{font-size:.7rem;font-weight:700;color:var(--tinta-media);background:var(--papel);border:1px solid var(--linea);padding:2px 8px;border-radius:99px}
.avi .al{font-size:.85rem;line-height:1.5;margin-top:8px;color:var(--tinta-media)}
.sp5 .donde{font-size:.76rem;color:var(--tinta-tenue);margin-top:4px;line-height:1.4}
.sp5 .cond{font-size:.78rem;font-weight:700;color:var(--tinta-media);margin-top:6px;line-height:1.4}
.conversa{padding:16px 17px;border-radius:var(--radio);background:var(--fondo);border:1px solid var(--linea)}
.conversa .cl{display:grid;gap:6px;font-size:.87rem;line-height:1.5;margin-top:10px}
.conversa .cl b{color:var(--tinta)}
.conversa .lin{margin-top:12px;padding-top:11px;border-top:1px solid var(--linea);font-size:.86rem;color:var(--tinta-media);line-height:1.9}
.plan .r .est{font-size:.7rem;font-weight:800;letter-spacing:.02em;padding:2px 9px;border-radius:99px;white-space:nowrap;border:1px solid;align-self:start}
.plan .est.parcial{background:#FFF7E3;color:#8A6A12;border-color:#E8C76A}
.plan .est.fuera{background:var(--coral-tenue);color:var(--coral);border-color:var(--coral)}
.plan .est.aporta{background:var(--verde-tenue);color:var(--verde-hondo);border-color:var(--verde)}
.plan .ap{font-size:.78rem;color:var(--tinta-tenue);line-height:1.45;margin-top:3px;grid-column:1}

.lead{font-size:.88rem;color:var(--tinta-media);line-height:1.5;margin-bottom:14px;max-width:62ch}
.glosa{display:grid;gap:5px;margin-top:16px;padding-top:13px;border-top:1px solid var(--linea);font-size:.8rem;color:var(--tinta-media);line-height:1.45}
.glosa b{color:var(--tinta)}
.lecturas{display:grid;gap:14px}
.lec{padding:15px 16px;border-radius:var(--radio);border:1px solid var(--linea);background:var(--fondo)}
.lec .lt{font-weight:800;font-size:.98rem;line-height:1.3}
.lec .lr{display:flex;flex-wrap:wrap;gap:6px;margin-top:9px}
.lec .lr span{font-size:.72rem;font-weight:700;color:var(--tinta-media);background:var(--papel);
  border:1px solid var(--linea);border-radius:99px;padding:3px 10px;line-height:1.35}
.lec .ll{font-size:.9rem;line-height:1.5;margin-top:10px}
.lec .li2{font-size:.9rem;line-height:1.5;margin-top:8px;padding-top:8px;border-top:1px solid var(--linea);color:var(--tinta-media)}
.sp5 .orig{font-size:.76rem;color:var(--tinta-tenue);margin-top:5px;line-height:1.4}
.nota-pie{font-size:.8rem;color:var(--tinta-tenue);margin-top:14px;line-height:1.5}
.alcbox{display:grid;gap:9px;font-size:.86rem;color:var(--tinta-media);line-height:1.5}
.alcbox>div{padding-left:13px;border-left:2px solid var(--linea)}
.refs{font-size:.72rem;color:var(--tinta-tenue);line-height:1.5;margin-top:14px;padding-top:11px;border-top:1px solid var(--linea)}
.foco{padding:16px 17px;border-radius:var(--radio);background:var(--verde-tenue);border:1px solid var(--verde)}
.foco .porq{font-size:.85rem;margin-top:10px;padding-top:9px;border-top:1px solid var(--verde);color:var(--tinta-media);line-height:1.5}
.foco .porq b{color:var(--tinta)}
.foco .k{font-size:.72rem;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--verde-hondo)}
.foco .t{font-weight:800;font-size:1.02rem;margin-top:4px;line-height:1.3}
.foco .hoy{font-size:.88rem;color:var(--tinta-media);margin-top:8px;line-height:1.45}
.foco .meta{font-size:.88rem;margin-top:9px;line-height:1.45;padding-top:9px;border-top:1px solid var(--verde)}

table.anx{width:100%;border-collapse:collapse;font-size:.82rem}
table.anx td{padding:7px 0;border-bottom:1px solid var(--linea);vertical-align:top}
table.anx td.n{text-align:right;font-weight:800;white-space:nowrap;padding-left:12px}
table.anx tr:last-child td{border-bottom:0}
details.anexo{margin-top:6px}
details.anexo summary{cursor:pointer;font-size:.86rem;font-weight:700;color:var(--verde-hondo);padding-block:6px}
.plan{font-size:.85rem}
.plan .r{display:grid;grid-template-columns:1fr auto;gap:10px;padding-block:7px;border-bottom:1px dotted var(--linea)}
.plan .r:last-child{border-bottom:0}
.plan .r b{color:var(--verde-hondo);white-space:nowrap;font-variant-numeric:tabular-nums}
.plan .r.enc{font-size:.74rem;font-weight:800;letter-spacing:.07em;text-transform:uppercase;color:var(--tinta-tenue);border-bottom:1px solid var(--linea);padding-bottom:8px}
.plan .r.enc b{color:var(--tinta-tenue)}
.plan .r i{font-style:normal;color:var(--tinta-tenue);font-weight:700}
.plan .r b.falta{color:var(--coral)}
.falta-box{margin-top:16px;padding:15px 16px;border-radius:var(--radio);background:var(--coral-tenue);border:1px solid var(--coral)}
.falta-box .ft{font-weight:800;font-size:.95rem;line-height:1.3}
.falta-box p{font-size:.88rem;line-height:1.5;margin-top:8px}
.copiabox{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-top:10px}
.copiaok{font-size:.8rem;font-weight:800;color:var(--verde-hondo)}
.dd.ligada{word-break:break-all;margin-top:8px;font-weight:700;color:var(--tinta)}

form.env{display:grid;gap:12px;margin-top:6px}
form.env .par{display:grid;gap:12px;grid-template-columns:1fr 1fr}
@media (max-width:540px){form.env .par{grid-template-columns:1fr}}
form.env label{font-size:.82rem;font-weight:700;display:block;margin-bottom:4px}
form.env input[type=text],form.env input[type=email],form.env input[type=tel]{width:100%;padding:12px 14px;border:1.5px solid var(--linea);border-radius:12px;background:var(--papel)}
form.env input:focus{border-color:var(--verde);outline:none}
.consent{display:flex;gap:10px;align-items:flex-start;font-size:.82rem;color:var(--tinta-media);line-height:1.45}
.consent input{margin-top:3px;width:18px;height:18px;accent-color:var(--verde);flex:none}
.estado{font-size:.88rem;padding:12px 14px;border-radius:12px;margin-top:12px}
.estado.ok{background:var(--verde-tenue);border:1px solid var(--verde)}
.estado.err{background:var(--coral-tenue);border:1px solid var(--coral)}

footer.pie{margin-top:40px;padding-top:18px;border-top:1px solid var(--linea);font-size:.8rem;color:var(--tinta-tenue);display:flex;gap:14px;flex-wrap:wrap}
.folio{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;font-size:.78rem;color:var(--tinta-tenue);padding-block:14px 0;border-top:1px solid var(--linea);margin-top:4px}

@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}
@media print{
  body{background:#fff}
  .pasos,.acc,header.top .cuenta,footer.pie,.noimp,form.env{display:none!important}
  .wrap{max-width:none;padding:0}
  .prop{box-shadow:none;border:0;margin:0}
  .bloq>h3{break-after:avoid}
  .radarbox,.detalle .dg,.glosa,.lec,.avi,.foco,.sp5 .it,.plan .r,.falta-box,.conversa,.alcbox>div{break-inside:avoid}
}

   a alguna letra del artículo 16 D, en el orden de las letras, y sigue con el resto. */
const ORDEN_DESEMPATE = ['4.3','2.1','3.3','5.3','5.2','5.1',
  '1.1','1.2','1.3','2.2','2.3','2.4','3.1','3.2','4.1','4.2'];

/* Las ventanas nombran momentos del año escolar, no fechas del calendario civil.
   Se imprimen con el año de la próxima vez que ocurren, calculado desde la fecha de respuesta.
   mes: mes en que se abre la ventana, para saber cuánto falta. */
const VENTANAS = {
  'En las próximas dos semanas de clases':
    { rel:true, marzo:'En las primeras dos semanas de clases de marzo' },
  'En la jornada de inicio, antes de que lleguen los estudiantes':
    { mes:2, suf:'de %A%' },
  'Entre abril y junio':         { mes:4,  suf:'de %A%' },
  'Entre agosto y mediados de octubre': { mes:8,  suf:'de %A%' },
  'Cuando se arma el año siguiente':
    { mes:10, txt:'Cuando se arma el año siguiente, en octubre y noviembre', suf:'de %A%' }
};
function ventana(v){
  const d = new Date(), m = d.getMonth() + 1, y = d.getFullYear();
  const c = VENTANAS[v];
  if (!c) return v;
  if (c.rel) return (m === 12 || m === 1 || m === 2) ? c.marzo + ' de ' + (m === 12 ? y+1 : y) : v;
  const anio = (m <= c.mes) ? y : y + 1;
  return (c.txt || v) + ' ' + c.suf.replace('%A%', anio);
}
function mesesHasta(v){
  const d = new Date(), m = d.getMonth() + 1;
  const c = VENTANAS[v];
  if (!c || c.rel) return 0;
  return (m <= c.mes) ? (c.mes - m) : (12 - m + c.mes);
}
/* Acciones cuya ventana depende de un momento en que se decide fuera de la rutina del año. */
const DECIDE_ANIO = ['4.1'];
function donde(id){
  return DECIDE_ANIO.indexOf(id) > -1
    ? 'Al armar el horario, la dotación y el presupuesto del año siguiente.'
    : 'En el establecimiento.';
}

const sinTilde = s => s.normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase();

/* ======================= cálculo ======================= */
const esNum = v => typeof v === 'number';

function banda(dim){
  const its = DIMS.find(d => d.id === dim).items;
  const vals = its.map(i => st.r[i.id]).filter(esNum);
  if (its.length - vals.length >= 2 || vals.length === 0)
    return {tipo:'sin', txt:'Sin respuestas suficientes', clase:'b-sin', val:null};
  const m = prom(vals);
  if (Math.max(...vals) - Math.min(...vals) >= 2)
    return {tipo:'disp', txt:'En niveles distintos', clase:'b-disp', val:m};
  if (m <  1.0) return {tipo:'b1', txt:'En los primeros niveles', clase:'b1', val:m};
  if (m <= 2.0) return {tipo:'b2', txt:'En el nivel intermedio',  clase:'b2', val:m};
  return           {tipo:'b3', txt:'En los niveles altos',        clase:'b3', val:m};
}
/* El detalle por ítem se imprime siempre, para que el promedio no sea lo único que se lee. */
function detalleDim(dim){
  return DIMS.find(d => d.id === dim).items
    .map(i => ({ t:i.t, n: esNum(st.r[i.id]) ? st.r[i.id] : null }))
    .sort((a,b) => (a.n === null) - (b.n === null) || a.n - b.n);
}
/* Cuatro segmentos en vez de la palabra. No lleva etiqueta evaluativa y se escanea de un vistazo. */
function barra(n){
  if (n === null) return '<span class="niv sr" title="Sin responder"><i></i><i></i><i></i><i></i></span>';
  let s = '<span class="niv" title="Nivel ' + (n+1) + ' de 4">';
  for (let k = 0; k < 4; k++) s += '<i class="' + (k <= n ? 'on' : '') + '"></i>';
  return s + '</span>';
}
const prom = v => v.reduce((a,b)=>a+b,0)/v.length;

const porId = id => ITEMS.find(i => i.id === id) || OPC.find(i => i.id === id);

/* Recorre los tramos en orden y devuelve los vacíos, cada uno con el tramo
   del que viene. Nunca salta un tramo anterior que todavía tiene vacíos. */
function ruta(umbral){
  const out = [];
  for (const t of TRAMOS) {
    const v = t.items.filter(id => esNum(st.r[id]) && st.r[id] <= umbral)
                     .sort((a,b) => st.r[a] - st.r[b]);
    for (const id of v) out.push({ it: porId(id), tramo: t });
  }
  return out;
}
function rutaCompleta(){
  let r = ruta(1);
  if (r.length < 3) {
    const ya = new Set(r.map(x => x.it.id));
    r = r.concat(ruta(2).filter(x => !ya.has(x.it.id)));
  }
  return r;
}
function instalado(){
  return ITEMS.filter(i => esNum(st.r[i.id]) && st.r[i.id] >= 2)
    .sort((a,b) => st.r[b.id] - st.r[a.id]).slice(0,5);
}
const ciclos = () => ITEMS.filter(i => st.dif[i.id]).length;
const noSabe = () => ITEMS.filter(i => st.r[i.id] === 'nose').length;

/* ======================= radar ======================= */
function radar(){
  const W = 400, H = 236, CX = W/2, CY = 112, R = 76;
  const ejes = DIMS.map(d => ({d, b: banda(d.id)}));
  const n = ejes.length;
  const pt = (i, rad) => {
    const a = -Math.PI/2 + i * 2*Math.PI/n;
    return [CX + Math.cos(a)*rad, CY + Math.sin(a)*rad];
  };
  let g = '';
  /* anillos que marcan el criterio, no la comparación con otros colegios */
  [1,2,3].forEach(lv => {
    const p = Array.from({length:n}, (_,i) => pt(i, R*lv/3).map(v=>v.toFixed(1)).join(',')).join(' ');
    g += `<polygon points="${p}" fill="none" stroke="var(--linea)" stroke-width="1"/>`;
  });
  ejes.forEach((_,i) => {
    const [x,y] = pt(i, R);
    g += `<line x1="${CX}" y1="${CY}" x2="${x.toFixed(1)}" y2="${y.toFixed(1)}" stroke="var(--linea)" stroke-width="1"/>`;
  });
  const vals = ejes.map(e => e.b.val == null ? 0 : e.b.val);
  const poly = vals.map((v,i) => pt(i, R*Math.max(v,0.08)/3).map(x=>x.toFixed(1)).join(',')).join(' ');
  g += `<polygon points="${poly}" fill="var(--verde)" fill-opacity=".22" stroke="var(--verde-hondo)" stroke-width="2.5" stroke-linejoin="round"/>`;
  vals.forEach((v,i) => {
    const [x,y] = pt(i, R*Math.max(v,0.08)/3);
    g += `<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="4" fill="var(--papel)" stroke="var(--verde-hondo)" stroke-width="2.5"/>`;
  });
  ejes.forEach((e,i) => {
    const [x,y] = pt(i, R+18);
    const an = x < CX-8 ? 'end' : x > CX+8 ? 'start' : 'middle';
    const dy = y < CY-40 ? -3 : y > CY+40 ? 11 : 4;
    g += `<text x="${x.toFixed(1)}" y="${(y+dy).toFixed(1)}" text-anchor="${an}" font-size="12.5" font-weight="800" fill="var(--tinta)">${esc(e.d.corto)}</text>`;
  });
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" style="max-width:360px;display:block;margin:0 auto" role="img"
    aria-label="Perfil de las cinco dimensiones del establecimiento">${g}</svg>`;
}

/* ======================= vistas ======================= */
function pintarPasos(){
  const total = 2 + CAPA1.length + CAPA2.length + 2;
  let n = 0;
  if (st.fase === 'colegio') n = 1;
  else if (st.fase === 'quien') n = 2;
  else if (st.fase === 'c1') n = 2 + st.idx + 1;
  else if (st.fase === 'espejo') n = 2 + CAPA1.length;
  else if (st.fase === 'c2') n = 2 + CAPA1.length + st.idx + 1;
  else if (st.fase === 'opc') n = total - 2;
  else if (st.fase === 'lead') n = total - 1;
  else if (st.fase === 'informe') n = total;
  const ps = $('#pasos');
  ps.hidden = (st.fase === 'portada' || st.fase === 'informe');
  ps.innerHTML = Array.from({length:total}, (_,i) => `<div class="paso${i<n?' on':''}"></div>`).join('');
  const c = $('#cuenta');
  if (st.fase === 'c1' || st.fase === 'c2') {
    const hechas = st.fase === 'c1' ? st.idx+1 : CAPA1.length + st.idx + 1;
    c.hidden = false; c.textContent = `Pregunta ${hechas} de ${ITEMS.length}`;
  } else c.hidden = true;
}
function ir(fase, idx){ st.fase = fase; if (idx != null) st.idx = idx; render(); window.scrollTo({top:0,behavior:'instant'}); }

function render(){
  pintarPasos();
  ({portada:vPortada, colegio:vColegio, quien:vQuien, c1:vPregunta, espejo:vEspejo,

}

function payload(){

  return {

                  siguiente: st.r[foco.it.id] < 3 ? foco.it.n[st.r[foco.it.id]+1] : null} : null,

    lecturas: lecturas().lect.map(x => x.t),

async function enviar(){
  const cuerpo = payload();
  const est = $('#estadoEnvio');
  if (!ENDPOINT) { if (est) est.innerHTML = `<div class="estado ok">Informe generado. El envío por correo se activa al conectar el backend.</div>`; return; }
  try {
    await fetch(ENDPOINT, {method:'POST', mode:'no-cors', headers:{'Content-Type':'text/plain;charset=utf-8'}, body:JSON.stringify(cuerpo)});
    if (est) est.innerHTML = `<div class="estado ok">Te mandamos una copia a ${esc(st.lead.correo)}.</div>`;
  } catch(e) {
    if (est) est.innerHTML = `<div class="estado err">No pudimos enviar la copia por correo. El informe de abajo es el mismo, puedes imprimirlo o guardarlo como PDF.</div>`;
  }
}

/* ======================= informe ======================= */
/* Lecturas cruzadas. Cada una se dispara solo si se cumplen sus condiciones exactas,
   muestra las respuestas en que se apoya y dice qué criterio usa. Ninguna conclusión
   sale de algo que la persona no haya declarado. */
/* Las lecturas se calculan sobre ítems, nunca sobre promedios de dimensión, para que
   ninguna lectura hable de una dimensión que el gráfico está declarando no interpretable.
   Ninguna afirma nada sobre lo que viven los estudiantes y ninguna usa verbos de causa.
   El orden del arreglo es el orden de prioridad, de la regla con evidencia a la solo plausible. */
function lecturas(){
  const v = id => st.r[id], n = id => esNum(v(id));
  const C = [];

  if (n('2.1') && n('2.2') && v('2.1') >= 2 && v('2.2') <= 1)
    C.push({ t:'Hay formación y la conversación posterior todavía no está instalada',
      r:['2.1, sobre la formación de quienes están en aula','2.2, sobre la observación y retroalimentación en aula'],
      l:'La formación del equipo quedó en los niveles altos y la observación de aula en los dos primeros, sin una conversación posterior que termine en acuerdos registrados.',
      i:'Los estudios que comparan la formación docente con y sin acompañamiento posterior observan que la práctica de aula cambia cuando alguien entra a la sala después y conversa sobre lo que vio. Sin ese paso, lo que el equipo aprendió tiende a quedarse en el conocimiento del contenido y no en lo que ocurre con el curso.' });

  if (n('1.1') && n('1.2') && n('4.2') && Math.min(v('1.1'),v('1.2')) >= 2 && v('4.2') <= 1)
    C.push({ t:'La práctica de aula va más adelante que el tiempo del equipo',
      r:['1.1 y 1.2, sobre el espacio semanal y las rutinas de la sala','4.2, sobre el tiempo destinado a este trabajo'],
      l:'Las dos preguntas sobre la práctica de aula quedaron en los niveles altos y el tiempo destinado a este trabajo todavía no alcanza al resto del equipo.',
      i:'En los estudios sobre implementación, que una práctica siga ocurriendo al año siguiente se asocia con que exista tiempo definido para el equipo completo y no solo para quien coordina. Mientras ese tiempo no esté escrito en el calendario, la práctica depende de que las personas que hoy la sostienen sigan en el establecimiento.' });

  if (n('1.2') && n('1.3') && v('1.2') >= 2 && v('1.3') <= 1)
    C.push({ t:'Hay rutinas comunes y la respuesta al desborde queda en la derivación',
      r:['1.2, sobre las rutinas comunes de manejo de aula','1.3, sobre qué ocurre cuando una clase se interrumpe de forma sostenida'],
      l:'Las rutinas de la sala quedaron en los niveles altos y lo que ocurre cuando la clase se interrumpe se resuelve por la vía de la derivación.',
      i:'Que el procedimiento de derivación exista no define por sí solo lo que hace el profesor. Lo que se observa es que cuando no está escrito qué situaciones salen de la sala y quién acompaña después a quien se quedó resolviendo, la derivación se vuelve la primera respuesta y no la excepción.' });

  if (n('1.1') && n('2.3') && v('1.1') >= 2 && v('2.3') <= 1)
    C.push({ t:'El espacio semanal está y la preparación para la jefatura de curso todavía no',
      r:['1.1, sobre la regularidad del espacio semanal','2.3, sobre la preparación de quien tiene la jefatura de curso'],
      l:'El espacio semanal quedó en los niveles altos y la preparación específica para el rol de jefatura de curso quedó en los dos primeros.',
      i:'Cuando ese bloque lo conduce quien tiene la jefatura de curso, la preparación para el rol es lo que determina qué ocurre adentro. El espacio ya está ganado en el horario, que es la parte difícil, y lo que queda por definir es con qué llega preparado quien lo conduce.' });

  if (n('1.2') && n('3.3') && v('1.2') >= 2 && v('3.3') <= 1)
    C.push({ t:'Lo acordado para la sala y los espacios de afuera',
      r:['1.2, sobre las rutinas comunes de manejo de aula','3.3, sobre los recreos, patios, traslados, entrada y salida'],
      l:'Las rutinas de la sala quedaron en los niveles altos y los espacios fuera de la sala en los dos primeros, sin criterios comunes de actuación.',
      i:'El criterio ya acordado para la sala puede aplicarse a esos espacios sin diseñar nada nuevo. Lo que falta para hacerlo es saber dónde y a qué hora se concentra lo que ocurre, y eso se obtiene registrándolo durante unas semanas antes de redistribuir turnos.' });

  if (n('2.1') && n('2.2') && v('2.2') >= 2 && v('2.1') <= 1)
    C.push({ t:'El ciclo de observación está y el foco común todavía no',
      r:['2.2, sobre la observación y retroalimentación en aula','2.1, sobre la formación de quienes están en aula'],
      l:'La observación con pauta y conversación posterior quedó en los niveles altos y la formación del equipo en los dos primeros.',
      i:'El ciclo de observación es la parte más difícil de instalar y en este establecimiento ya está funcionando. Sin un foco común definido para el año, cada conversación se apoya en el criterio de quien observa, de modo que dos profesores pueden recibir indicaciones distintas sobre lo mismo.' });

  if (n('5.1') && n('3.1') && v('5.1') >= 2 && v('3.1') <= 1)
    C.push({ t:'La instancia con las familias está y el criterio común entre los adultos todavía no',
      r:['5.1, sobre el vínculo formativo con las familias','3.1, sobre el lenguaje común entre los adultos'],
      l:'Las instancias formativas con apoderados quedaron en los niveles altos y el criterio con que los adultos describen lo que ocurre todavía no se extiende al conjunto del equipo.',
      i:'Las instancias con apoderados ya existen y tienen convocatoria. Lo que define si suman es que su contenido sea el mismo criterio que usa el equipo, de modo que lo que la familia escucha en el taller y lo que le llega después por la agenda o por la plataforma del establecimiento coincidan.' });

  if (n('4.1') && n('4.2') && n('1.1') && n('1.2') &&
      Math.min(v('4.1'),v('4.2')) >= 2 && Math.max(v('1.1'),v('1.2')) <= 1)
    C.push({ t:'La instancia de decisión está más adelante que la rutina semanal',
      r:['4.1 y 4.2, sobre dónde se resuelven estas decisiones y qué tiempo hay','1.1 y 1.2, sobre el espacio semanal y las rutinas de la sala'],
      l:'Las dos preguntas sobre la estructura de decisión quedaron en los niveles altos y las dos sobre la práctica semanal en los dos primeros. La instancia y el tiempo del equipo ya están, así que lo que falta en la sala no depende de conseguirlos.',
      i:'La estructura de decisión ya está, así que lo que falta en la sala no depende de conseguirla. El momento en que esa instancia tiene más efecto sobre el aula es cuando se arma el horario del año siguiente, porque ahí quedan fijados los bloques de cada curso.' });

  /* Regla de cierre. Dispara solo si ninguna de las anteriores disparó, de modo que la sección
     nunca llegue vacía. Cubre al establecimiento que responde parejo, que es el que hoy recibía
     menos. No es relleno: un cruce exige dos respuestas en niveles distintos. */
  let lect = C.slice(0,2);
  if (!C.length) {
    const nv = ITEMS.map(i => st.r[i.id]).filter(esNum);
    const bajos = nv.filter(x => x <= 1).length, altos = nv.filter(x => x >= 2).length;
    if (bajos >= 10) lect = [{ t:'El punto de partida quedó parejo',
      r:['las dieciséis respuestas, tomadas en conjunto'],
      l:'Diez o más de las dieciséis respuestas quedaron en los dos primeros niveles y ninguna práctica quedó claramente más adelante que las otras.',
      i:'Por eso el orden de más abajo no sale de comparar las dimensiones de este establecimiento, sale del criterio que declaramos ahí. En los estudios sobre implementación, la calidad con que se instala una práctica se asocia con los resultados que alcanza, así que concentrar el año en la primera de esa lista es una decisión de criterio y no un resultado de este cuestionario.' }];
    else if (altos >= 10) lect = [{ t:'Lo que sigue en esta etapa ya no es instalar',
      r:['las dieciséis respuestas, tomadas en conjunto'],
      l:'Diez o más de las dieciséis respuestas quedaron en los dos niveles altos y no apareció ninguna de las combinaciones que este informe cruza.',
      i:'En esta etapa la pregunta que se asocia con mantener lo que está es con qué dato se va a saber el año que viene si siguió ocurriendo, y qué queda escrito si quien lo conduce deja el establecimiento. Las tres preguntas opcionales de este cuestionario apuntan ahí.' }];
    else lect = [{ t:'Las respuestas quedaron repartidas entre niveles',
      r:['las dieciséis respuestas, tomadas en conjunto'],
      l:'Las respuestas quedaron repartidas entre los cuatro niveles y no apareció ninguna de las combinaciones que este informe cruza.',
      i:'El orden de más abajo no sale de comparar las dimensiones de este establecimiento, sale del criterio que declaramos ahí. El detalle de cada práctica por separado está bajo el gráfico.' }];
  }

  /* Avisos sobre el dato. Van en su propio bloque, antes de las lecturas, y no compiten por el tope.
     Nombran lo que efectivamente quedó marcado, en vez de afirmar su contenido. */
  const avisos = [];
  const sr = ITEMS.filter(i => st.r[i.id] === 'nose');
  if (sr.length >= 3) avisos.push({
    t: 'Hay ' + sr.length + ' prácticas sobre las que no había certeza',
    r: sr.map(i => i.t.toLowerCase()),
    l:'Estas quedaron fuera del gráfico, porque el informe no completa lo que no se respondió.',
    i:'Si en el establecimiento hay alguien que sí tiene ese dato, conviene preguntárselo. Una dimensión con dos prácticas sin responder queda sin nivel en el gráfico.' });
  const dif = ITEMS.filter(i => st.dif[i.id]);
  if (st.ciclo === COMPLETO && dif.length >= 3) avisos.push({
    t:'Hay ' + dif.length + ' prácticas que funcionan distinto según el ciclo',
    r: dif.map(i => i.t.toLowerCase()),
    l:'Respondiste por el establecimiento completo, así que estas prácticas aparecen con un solo nivel aunque adentro convivan realidades distintas.',
    i:'Que una práctica funcione distinto entre un ciclo y otro es un dato en sí mismo, porque muestra que lo que está instalado no está parejo dentro del mismo establecimiento. Responder de nuevo eligiendo un ciclo muestra el nivel de cada uno por separado, en los mismos seis minutos.' });

  return { avisos, lect };
}

        <p class="nota-pie">Las tres se revisan en el mismo lugar, el punto de convivencia de la reunión del equipo directivo. La ventana indica cuándo cuesta menos instalarla. Las fechas las define el establecimiento.</p>
      </div>` : ''}

      <div class="bloq"><h3>Qué hacer con esto</h3>
        <div class="segunda">
          <div><b>Mírenlo entre varios antes de partir.</b> Este informe lo respondió una persona y casi todo lo de arriba necesita que alguien más acepte mover algo. Veinte minutos de la reunión del equipo directivo que ya tienen, con quien dirige, quien lidera la UTP, quien coordina convivencia y alguien que esté en aula. Lo único que se decide es si están de acuerdo con lo que quedó marcado, cuál acción parte y quién queda con ella.</div>
          <div class="lin">Acción que parte ____________ · A cargo de ____________ · Se revisa el ____________</div>
          <div><b>Pide una segunda respuesta.</b> ${esc(segundaRespuesta())} Son los mismos seis minutos, el enlace es el que ya tienes, y la diferencia entre las dos respuestas es material para esa misma conversación.</div>
          <div class="copiabox noimp"><button class="btn s" id="copiar" style="padding:9px 16px;font-size:.84rem">Copiar el enlace para tu equipo</button><span id="copiaOk" class="copiaok" hidden>Enlace copiado</span></div>
          <div class="dd ligada" id="copiaTxt" hidden></div>
        </div>
      </div>

      ${inst.length ? `<div class="bloq"><h3>Lo que ya tienes instalado</h3>
        <p class="lead">Lo que marcaste en los dos niveles más altos, y es la base sobre la que se apoyan las acciones de arriba: ${esc(inst.map(i => i.t.toLowerCase()).join('; '))}.</p>
      </div>` : ''}

      <div class="bloq"><h3>Dónde se conecta esto con el Plan de Gestión</h3>
        <p class="lead">El Plan de Gestión de Convivencia Educativa debe contener siete contenidos mínimos, fijados en el artículo 16 D del decreto con fuerza de ley N° 2, de 2009, del Ministerio de Educación, reemplazado por el artículo 1 N° 9 de la Ley N° 21.809. La tabla indica qué preguntas de este cuestionario se refieren a cada uno, para que sepas dónde tienes material. Describe este cuestionario, no tu plan.</p>
        <div class="plan">
          <div class="r enc"><span>Contenido mínimo del plan</span><b>Preguntas</b></div>
          ${MAPA_16D.map(x => `<div class="r"><span><i>${esc(x.l)})</i> ${esc(x.rot)}</span><b${x.preg.length?'':' class="falta"'}>${x.preg.length ? esc(x.preg.join(' y ')) : 'ninguna'}</b></div>`).join('')}
        </div>
        <div class="falta-box">
          <div class="ft">Qué no hace esta tabla</div>
          <p>No dice si tu plan cumple, ni si un contenido está cubierto. Son dieciséis preguntas y no recorren los siete contenidos. Quien verifica el cumplimiento es la Superintendencia de Educación.</p>
          <p>La ley rige desde el 1 de julio de 2026. En los establecimientos subvencionados o que reciben aportes del Estado, el artículo quinto transitorio da nueve meses desde esa fecha para implementar los artículos 16 D a 16 H, y el duodécimo transitorio sujeta a ese mismo plazo la elaboración del primer Plan de Gestión de Convivencia Educativa y la actualización del reglamento interno.</p>
        </div>
      </div>

      <div class="bloq"><h3>Alcance de este informe</h3>
        <div class="alcbox">
          <div>Describe prácticas declaradas por una persona, desde un cargo y un alcance determinados, en una fecha. No necesariamente describe el estado del establecimiento, y no verifica el cumplimiento de normativa educacional.</div>
          <div>El gráfico muestra cada dimensión por separado y no está hecho para compararlas entre sí, porque no están equiparadas en dificultad. Cada lectura se apoya solo en las respuestas que ella misma indica.</div>
          <div>Si decides tomar las acciones de más arriba, cada una necesita objetivos, lugar, fecha y encargado para entrar al plan.</div>
        </div>
      </div>

      <div class="bloq">
        <h3>Quién hizo este instrumento</h3>
        <p style="font-size:.9rem;line-height:1.5">Fundación Eventuras acompaña a colegios en formación docente y aprendizaje socioemocional.
        Representante y socio implementador de Second Step en Chile. Programas alineados al marco CASEL.</p>
        <p style="font-size:.9rem;line-height:1.5;margin-top:8px"><a href="${CONTACTO.sitio}" target="_blank" rel="noopener">eventuras.org</a> · ${esc(CONTACTO.correo)}</p>
        <p class="refs">Referencias. Durlak y colaboradores (2011), Child Development, 82(1), 405-432. · Kraft, Blazar y Hogan (2018), Review of Educational Research, 88(4), 547-588. · Durlak y DuPre (2008), American Journal of Community Psychology, 41(3-4), 327-350. · Ley N° 21.809, publicada el 1 de abril de 2026, artículos quinto y duodécimo transitorios, y artículo 16 D del decreto con fuerza de ley N° 2, de 2009, del Ministerio de Educación.</p>
      </div>

      ${esEj ? `<div class="bloq" style="padding-bottom:4px"><p style="font-size:.84rem;color:var(--coral);font-weight:700">Informe de ejemplo, con respuestas inventadas para revisar el diseño.</p></div>` : ''}

      <div class="folio">
        <span>Folio ${esc(FOLIO)} · ${esc(hoy)} · Respondido desde ${esc(st.cargo||'')}${st.ciclo?' · '+esc(st.ciclo):''}</span>
        <span>Fundación Eventuras</span>
      </div>
    </div>
  </div>
  <div id="estadoEnvio"></div>
  <div class="acc noimp">
    <button class="btn p" id="imp">Descargar o imprimir</button>
    <button class="btn s" id="otra">Responder por un ciclo en particular</button>
  </div>`;
  const enlace = location.origin + location.pathname;
  const bc = $('#copiar');
  if (bc) bc.onclick = async () => {
    try {
      await navigator.clipboard.writeText(enlace);
      $('#copiaOk').hidden = false;
      setTimeout(() => { const e2 = $('#copiaOk'); if (e2) e2.hidden = true; }, 2600);
    } catch(e) {
      const t = $('#copiaTxt');
      t.textContent = enlace; t.hidden = false;
      const rg = document.createRange(); rg.selectNodeContents(t);
      const sel = window.getSelection(); sel.removeAllRanges(); sel.addRange(rg);
    }
  };
  $('#imp').onclick = () => window.print();
  $('#otra').onclick = () => { st.r = {}; st.o = {}; st.dif = {}; st.verOpc = false; ir('quien'); };
}

            region:'Los Lagos', dep:'Particular subvencionado', mat:612};
  st.cargo = 'Coordinación de la Convivencia Educativa';
  st.ciclo = 'El establecimiento completo';

          '3.1':1,'3.2':1,'3.3':0,'4.1':2,'4.2':1,'4.3':'nose','5.1':2,'5.2':0,'5.3':1};

if (location.hash === '#ejemplo') ejemplo();
window.addEventListener('hashchange', () => {
  if (location.hash === '#ejemplo') { ejemplo(); render(); window.scrollTo(0,0); }
});

render();
</script>
