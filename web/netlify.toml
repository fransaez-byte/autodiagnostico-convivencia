[build]
  publish = "."

# El directorio de colegios casi no cambia, así que se cachea fuerte.
[[headers]]
  for = "/establecimientos.json"
  [headers.values]
    Cache-Control = "public, max-age=86400"

# La página sí, porque el instrumento se va a seguir ajustando.
[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"
